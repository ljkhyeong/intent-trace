apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: intent-trace
resources:
  - namespace.yaml
  - app.yaml
  - postgres.yaml
  - ingress.yaml
configMapGenerator:
  - name: intent-trace-config
    envs:
      - config.env
  - name: intent-trace-database-config
    envs:
      - database.env
secretGenerator:
  - name: intent-trace-secrets
    envs:
      - .env.secrets
  - name: intent-trace-database-secrets
    envs:
      - .env.database.secrets
images:
  - name: intent-trace
    newName: intent-trace
    newTag: local
