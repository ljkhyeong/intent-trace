apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intent-trace
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - intent-trace.example.com
      secretName: intent-trace-tls
  rules:
    - host: intent-trace.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: intent-trace
                port:
                  name: http
