name: 검증

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 서버 검증
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 저장소 받기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Java 21 준비
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Python 준비
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Node.js 22 준비
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/zed/package-lock.json

      - name: Zed 연결 도구 준비
        run: npm ci --prefix clients/zed --ignore-scripts

      - name: Zed 연결 입력 검증
        run: npm test --prefix clients/zed

      - name: 전체 테스트
        run: ./gradlew --no-daemon test bootJar

      - name: 릴리스 version 확인
        run: python3 scripts/validate-release-version.py

      - name: 릴리스 파일 준비 코드 테스트
        run: python3 scripts/test_validate_release_version.py

      - name: 테스트 결과 집계 코드 확인
        run: python3 scripts/test_test_summary.py

      - name: 에이전트 검증 루프 확인
        run: python3 scripts/test_feedback.py

      - name: 플러그인 검증
        env:
          CODEX_PLUGIN_VALIDATOR: scripts/validate-plugin-layout.py
        run: scripts/validate-plugin.sh

      - name: 동시 백업 파일 보존 확인
        run: python3 scripts/test_backup_postgres.py

      - name: PostgreSQL 계약 검증
        run: scripts/verify-postgres.sh

      - name: Compose 경계 검증
        run: python3 scripts/validate-compose.py .env.team.example

      - name: k3s 배포 파일 검증
        run: |
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl -o "$RUNNER_TEMP/kubectl"
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl.sha256 -o "$RUNNER_TEMP/kubectl.sha256"
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/kubectl" | sha256sum --check
          curl --fail --silent --show-error --location https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o "$RUNNER_TEMP/kubeconform.tar.gz"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          chmod +x "$RUNNER_TEMP/kubectl" "$RUNNER_TEMP/kubeconform"
          PATH="$RUNNER_TEMP:$PATH" bash scripts/validate-k3s.sh

      - name: Caddy 설정 검증
        run: docker compose --env-file .env.team.example run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Container image build
        run: docker build --tag intent-trace:ci .

  intellij-plugin:
    name: IntelliJ 플러그인 검증
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 저장소 받기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Java 21 준비
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: 테스트와 설치 ZIP 검증
        run: ./gradlew --no-daemon -p intellij-plugin test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

  verify:
    name: verify
    needs:
      - server
      - intellij-plugin
    runs-on: ubuntu-24.04
    steps:
      - name: 전체 검증 결과 확인
        run: echo '서버와 IntelliJ 플러그인 검증이 완료됐습니다.'
