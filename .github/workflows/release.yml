name: 릴리스

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # verify.yml의 concurrency 그룹은 이 workflow 이름으로 계산되므로 여기에 같은 그룹을 두지 않는다.
  verify:
    name: 일반 검증
    uses: ./.github/workflows/verify.yml

  release:
    name: 서버와 IntelliJ 플러그인 발행
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 쓰기 권한은 검증을 통과한 뒤 발행하는 job에만 준다.
    permissions:
      contents: write
    steps:
      - name: 저장소 받기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Java 21 준비
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: 실행 JAR과 IntelliJ 설치 ZIP 생성
        run: |
          ./gradlew --no-daemon bootJar
          ./gradlew --no-daemon -p intellij-plugin buildPlugin

      - name: tag와 배포 파일 확인
        run: python3 scripts/validate-release-version.py --release-tag "${GITHUB_REF_NAME}"

      - name: GitHub Release 발행
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/release/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
