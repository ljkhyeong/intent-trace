name: 릴리스

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: 서버와 IntelliJ 플러그인 발행
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 저장소 받기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Java 21 준비
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Python 준비
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: 서버 테스트와 실행 JAR 생성
        run: ./gradlew --no-daemon test bootJar

      - name: IntelliJ 플러그인 테스트와 설치 ZIP 생성
        run: ./gradlew --no-daemon -p intellij-plugin test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure

      - name: tag와 배포 파일 확인
        run: python3 scripts/validate-release-version.py --release-tag "${GITHUB_REF_NAME}" --prepare-directory build/release

      - name: GitHub Release 발행
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/release/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
