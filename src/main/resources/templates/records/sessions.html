<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{records/layout :: page(~{::main})}">
<main id="content">
<header class="page-heading"><h1>내 연결 관리</h1><p>최근 사용과 만료 시각을 확인하고 사용하지 않는 연결을 종료하세요.</p></header>
<ul class="records">
<li th:each="item : ${page.sessions}"><div><span class="status" th:text="${item.state}"></span><h2 th:text="${item.heading}"></h2><dl><dt>생성</dt><dd><time th:datetime="${item.createdAt.iso}" th:text="${item.createdAt.display}"></time></dd><dt>최근 사용</dt><dd><time th:datetime="${item.lastUsedAt.iso}" th:text="${item.lastUsedAt.display}"></time></dd><dt>만료</dt><dd><time th:datetime="${item.expiresAt.iso}" th:text="${item.expiresAt.display}"></time></dd></dl><form method="post" th:action="${item.revokeUrl}"><button class="secondary" th:text="${item.action}"></button></form></div></li>
</ul><section class="session-actions"><h2>모든 연결 종료</h2><p>내 모든 브라우저·Agent·API 연결이 종료됩니다. 다시 사용하려면 로그인하세요.</p><form method="post" action="/records/sessions/revoke-all"><button>모든 연결 종료·로그아웃</button></form></section>
</main>
</html>
