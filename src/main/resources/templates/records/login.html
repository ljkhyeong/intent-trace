<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{records/layout :: page(~{::main})}">
<main id="content"><section class="welcome"><span class="trace-mark" aria-hidden="true">↳</span>
<h1>코드 변경 이유와 검증 결과를 확인하세요.</h1>
<p>GitHub 계정으로 로그인해 팀의 변경 기록을 확인하세요.</p>
<p class="notice" th:if="${page.expired}">연결이 만료됐습니다. 다시 로그인하면 보던 기록으로 돌아옵니다.</p>
<a class="button" th:href="${page.loginUrl}">GitHub로 로그인</a>
<p class="muted">접근 권한이 있는 저장소의 기록만 표시합니다.</p></section></main>
</html>
