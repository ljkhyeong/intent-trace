spring.application.name=intent-trace
server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:h2:file:./.intent-trace/data/intent-trace;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false
spring.flyway.enabled=true
spring.profiles.group.team=postgres

spring.ai.mcp.server.name=intent-trace
spring.ai.mcp.server.version=0.10.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s
spring.http.clients.redirects=dont-follow

intent-trace.github.api-base-url=https://api.github.com
intent-trace.github.api-version=2026-03-10
intent-trace.github.token=${INTENT_TRACE_GITHUB_TOKEN:}
intent-trace.github.app.client-id=${INTENT_TRACE_GITHUB_APP_CLIENT_ID:}
intent-trace.github.app.private-key-base64=${INTENT_TRACE_GITHUB_APP_PRIVATE_KEY_BASE64:}
intent-trace.github.app.refresh-before-expiry=5m
intent-trace.github.user-authorization.web-base-url=https://github.com
intent-trace.github.user-authorization.client-secret=${INTENT_TRACE_GITHUB_APP_CLIENT_SECRET:}
intent-trace.github.user-authorization.callback-url=${INTENT_TRACE_GITHUB_CALLBACK_URL:http://127.0.0.1:8080/auth/github/callback}
intent-trace.github.user-authorization.state-ttl=10m
intent-trace.github.user-authorization.refresh-before-expiry=5m
