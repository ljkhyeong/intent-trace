spring.application.name=intent-trace
server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:h2:file:./.intent-trace/data/intent-trace;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false
spring.flyway.enabled=true

spring.ai.mcp.server.name=intent-trace
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
