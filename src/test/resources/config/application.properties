# 테스트 컨텍스트마다 새 H2 DB를 쓴다. 프로필 파일(application-postgres.properties 등)과 @SpringBootTest properties가 이 값보다 우선한다.
# ${random.uuid}는 조회할 때마다 바뀌므로 다른 속성에서 spring.datasource.url을 참조하지 않는다.
# 개발자 셸의 INTENT_TRACE_GITHUB_* 값은 build.gradle.kts의 Test 작업이 테스트 JVM에 넘기지 않는다.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
# 실제 서버를 띄우는 RANDOM_PORT 테스트가 컨텍스트 종료 때 기본 graceful shutdown을 기다리지 않게 한다. MockMvc 컨텍스트에는 영향이 없다.
server.shutdown=immediate
