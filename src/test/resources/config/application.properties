# 테스트 컨텍스트마다 새 H2 DB를 쓰고 개발자 셸의 INTENT_TRACE_GITHUB_* 값을 받지 않는다.
# 프로필 파일(application-postgres.properties 등)과 @SpringBootTest properties가 이 값보다 우선한다.
# ${random.uuid}는 조회할 때마다 바뀌므로 다른 속성에서 spring.datasource.url을 참조하지 않는다.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1

intent-trace.github.token=
intent-trace.github.webhook-secret=
intent-trace.github.app.client-id=
intent-trace.github.app.private-key-base64=
intent-trace.github.user-authorization.client-secret=
intent-trace.github.user-authorization.callback-url=http://127.0.0.1:8080/auth/github/callback
